name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      # offline eval of the known path: fails the build if any ticket is auto-resolved by mistake
      - run: python -m known_incidents.evaluate --max-wrong-auto 0
